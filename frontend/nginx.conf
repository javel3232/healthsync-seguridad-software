# nginx: sirve la SPA (Vue) y redirige /api al backend.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # La foto de la tarjeta profesional (máx. 2 MB) es lo más grande que sube un usuario.
    client_max_body_size 3m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (se envían en todas las respuestas) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # La SPA solo carga scripts, estilos e imágenes de su propio origen: un script inyectado no se ejecuta.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Los endpoints internos son solo para los robots (red de Docker): nunca se exponen al exterior.
    location /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        # Se sobrescribe (no se acumula) la IP del cliente: el backend no puede ser engañado con un X-Forwarded-For falso.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos con huella en el nombre: se pueden guardar en caché sin riesgo.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # Rutas de la SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
